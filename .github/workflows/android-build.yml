name: Android native build

on:
  pull_request:
  push:
    branches:
      - feat/music-first-reconstruction
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-37 build-tools;35.0.0'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Print generated Gradle configuration
        run: |
          echo '--- android/settings.gradle ---'
          cat android/settings.gradle
          echo '--- android/build.gradle ---'
          cat android/build.gradle
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeMaster-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
